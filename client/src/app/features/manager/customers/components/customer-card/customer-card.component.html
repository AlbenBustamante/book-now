<app-card>
  <header class="flex flex-col gap-y-3.5 items-center justify-center">
    <div class="size-16 sm:size-18 bg-primary-300 rounded-full"></div>
    <h3 class="text-sm sm:text-base font-medium">John Doe</h3>
  </header>
  <app-divisor />
  <ul class="font-medium flex flex-col gap-y-1.5">
    <li
      class="flex items-center justify-between gap-x-1 text-primary-700 text-xs sm:text-sm"
    >
      Last appointment:
      <span class="text-gray-600 text-sm sm:text-base">12/12/2023</span>
    </li>
    <li
      class="flex items-center justify-between gap-x-1 text-primary-700 text-xs sm:text-sm"
    >
      Service:
      <span class="text-gray-600 text-sm sm:text-base">SEO Audit</span>
    </li>
  </ul>
  <footer class="w-full flex items-center justify-center">
    <button
      class="w-full text-center border-2 border-primary-600 rounded-xl py-3 px-5 text-sm sm:text-base font-medium bg-white text-primary-600 hover:bg-primary-600 hover:text-white transition-colors duration-200 cursor-pointer"
      (click)="viewDetails()"
    >
      View Details
    </button>
  </footer>
</app-card>
