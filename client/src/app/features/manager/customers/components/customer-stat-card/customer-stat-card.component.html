<app-card>
  <div class="flex items-center justify-between gap-x-1">
    <div class="flex flex-col gap-y-1.5">
      <h2 class="uppercase font-semibold text-xs sm:text-sm">
        {{ headline() }}
      </h2>
      <strong class="text-3xl sm:text-4xl text-gray-800">{{ value() }}</strong>
    </div>
    <div class="w-13 h-14 grid place-content-center" [ngClass]="bgColor()">
      <div class="size-8" [ngClass]="iconColor()"></div>
    </div>
  </div>
</app-card>
