<app-new-service-card headline="Service Cover">
  <div class="flex flex-col gap-y-8">
    <label
      for="uploader"
      class="group w-4/5 h-auto mx-auto aspect-square border-4 border-dashed border-primary-600 rounded-xl flex flex-col gap-y-2.5 justify-center cursor-pointer hover:bg-primary-600 hover:text-white duration-300 active:bg-primary-700 active:border-primary-700"
    >
      <input
        type="file"
        id="uploader"
        class="sr-only"
        accept="image/*"
        (change)="onChange($event)"
      />
      <div
        class="size-1/3 rounded-full bg-primary-200 group-hover:bg-white mx-auto"
      ></div>
      <span class="text-center font-medium">
        {{ store.coverPhotoHeadline() }}
      </span>
      <span class="text-sm text-center text-pretty">
        Supported files: .jpg, .jpeg, .png
      </span>
    </label>
    <img
      [src]="store.url()"
      alt="Selected image as cover photo for this service"
      class="w-4/5 h-auto mx-auto aspect-square rounded-xl"
    />
  </div>
</app-new-service-card>
