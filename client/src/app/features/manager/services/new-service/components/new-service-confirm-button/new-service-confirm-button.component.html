<app-new-service-card headline="Finalize Service" theme="dark">
  <p class="text-sm sm:text-base text-pretty">
    Once created, this service will be visible to clients on the website.
  </p>
  <div class="flex flex-col gap-y-2.5">
    <app-button [disabled]="!store.canSubmit()">Create Service</app-button>
    <app-button color="gray">Cancel</app-button>
  </div>
</app-new-service-card>
