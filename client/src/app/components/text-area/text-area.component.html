<div class="flex flex-col gap-1.5">
  @if (label() !== null) {
    <label
      [for]="name()"
      class="text-sm sm:text-base text-gray-700 tracking-tighter font-medium"
    >
      {{ label() }}
    </label>
  }
  <textarea
    [id]="name()"
    [placeholder]="placeholder()"
    [formControl]="control()"
    class="outline-none px-2.5 sm:px-3.5 py-1.5 rounded-2xl text-sm sm:text-base text-gray-700 border-2 border-gray-200 bg-gray-50 active:ring-1 active:ring-primary-600 active:border-primary-600 focus:ring-1 focus:ring-primary-600 focus:border-primary-600 active:shadow-lg focus:shadow-md transition-all placeholder-gray-400 disabled:bg-gray-100 resize-none field-sizing-content min-h-22"
    rows="3"
  ></textarea>
</div>
