<a
  [routerLink]="['service', service().id]"
  class="hover:opacity-80 transition-opacity"
>
  <article class="flex flex-col gap-3.5 w-52">
    <img
      [src]="service().photoUrl"
      alt="Service Photo"
      class="w-full h-auto aspect-square rounded-lg"
    />
    <div class="flex flex-col gap-y-0.5">
      <h4 class="text-base sm:text-lg font-medium">{{ service().name }}</h4>
      <p class="text-sm sm:text-base text-gray-500">4.8 (3 reviews)</p>
    </div>
  </article>
</a>
